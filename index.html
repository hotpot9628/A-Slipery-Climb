# screen pixels (real, hardware)
WIDTH=1024  # 1280
HEIGHT=600  # 720

# reference/idealized screen pixels
REFX = 1980
REFY = 1080

def u(real, ref, v):
    if abs(v)<0.9999999:
        result = int( (float(real)/100.0) * (v*1000))
        if v<0:
            return real-result
        return result
    return int( (real/ref) * v )

def ux(*argv):
    global WIDTH, REFX
    acc = 0
    for v in argv:
        acc += u(WIDTH, REFX, v)
    return acc

def uy(*argv):
    global HEIGHT, REFY
    acc = 0
    for v in argv:
        acc += u(HEIGHT, REFY, v)
    return acc

async def custom_site():

    import sys
    import asyncio
    import platform
    import json
    from pathlib import Path



    import embed


    platform.document.body.style.background = "#7f7f7f"

    import pygame

    def compose():
        pygame.display.update()
        window.chromakey(None, *screen.get_colorkey(), 40)

    pygame.init()
    pygame.font.init()

    screen = pygame.display.set_mode([ux(.100),uy(.100)], pygame.SRCALPHA, 32)
    screen.set_colorkey( (0,0,0,0), pygame.RLEACCEL )
    screen.fill( (0,0,0,0) )

    compose()

    platform.window.transfer.hidden = true
    platform.window.canvas.style.visibility = "visible"



    apk = "src.apk"

    bundle = "src"

    # the C or js loader could do that but be explicit.
    appdir = Path(f"/data/data/{bundle}") # /data/data/src
    appdir.mkdir()


    # mount apk

    cfg = {
        "io": "url",
        "type":"mount",
        "mount" : {
            "point" : appdir.as_posix(),
            "path" : "/",
        },
        "path" : f"/ => {appdir.as_posix()}",
    }


    track = platform.window.MM.prepare(apk, json.dumps(cfg))

    marginx = ux(.020) # 20%
    marginy = uy(.045) # 45%


    def pg_bar(pos):
        nonlocal marginx, marginy
        # resolution of progress bar, recalculate since it may not be know yet.
        total = track.len or 10  # avoid div0
        slot = ux(.060)/ total # 60%

        pygame.draw.rect(screen,(10,10,10),( marginx-ux(10), marginy-uy(10), (total*slot)+ux(20), uy(110) ) )
        pygame.draw.rect(screen,(0,255,0), ( marginx, marginy, track.pos*slot, uy(90)) )

    # wait until zip mount + overlayfs is complete
    while not track.ready:
        pg_bar(track.pos)
        compose()
        await asyncio.sleep(.1)

    # fill it up in case it was cached and instant download
    pg_bar(track.len)
    compose()


    # preloader will change dir and prepend it to sys.path
    platform.run_main(PyConfig, loaderhome= appdir / "assets", loadermain=None)


    # wait preloading complete
    # that includes images and wasm compilation of bundled modules
    while embed.counter()<0:
        await asyncio.sleep(.1)

    main = appdir / "assets" / "main.py"

    # start async top level machinery and add a console.
    await TopLevel_async_handler.start_toplevel(platform.shell, console=window.python.config.debug)

    # now that apk is mounted we have access to font cache
    # but we need to fill __file__ that is not yet set
    __import__(__name__).__file__ = str(main)


    # now make a prompt
    fnt = pygame.sysfont.SysFont("freesans",  uy(80) )

    def ui_callback(pkg, error=None):
        nonlocal fnt
        if error:
            prompt = fnt.render(f"{error}", True, "black")
        else:
            prompt = fnt.render(f"Setting [{pkg}] up", True, "black")
        pg_bar(track.len)
        screen.blit(prompt, ( marginx+ ux(80), marginy - uy(10) ) )
        compose()

    # test/wait if user media interaction required
    if not platform.window.MM.UME:

        # now make a prompt
        fnt = pygame.sysfont.SysFont("freesans",  uy(80) )
        prompt = fnt.render(" ", True, "blue")
        pg_bar(track.len)
        screen.blit(prompt, ( marginx+ ux(80), marginy - uy(10) ) )
        compose()
        print("""
        * Waiting for media user engagement : please click/touch page *
    """)
        while not platform.window.MM.UME:
            await asyncio.sleep(.1)

    # cleanup
    screen.fill( (0,0,0,0) )
    pygame.display.flip()

    await shell.runpy(main, callback=ui_callback)



import asyncio

asyncio.run( custom_site() )

    <script>
        (function () {
            var gate = document.getElementById('as-gate');
            var status = document.getElementById('as-status');
            var started = false;
            function isPhone() {
                return (navigator.maxTouchPoints > 0)
                    && window.matchMedia
                    && window.matchMedia('(pointer: coarse)').matches;
            }
            function lockLandscape() {
                var so = screen.orientation || screen.mozOrientation
                    || screen.msOrientation;
                if (so && so.lock) {
                    try {
                        var p = so.lock('landscape');
                        if (p && p.catch) p.catch(function () {});
                    } catch (e) {}
                }
            }
            function goFullscreen() {
                if (!isPhone()) return;
                var el = document.documentElement;
                var fn = el.requestFullscreen || el.webkitRequestFullscreen
                    || el.webkitRequestFullScreen || el.msRequestFullscreen;
                if (!fn) { lockLandscape(); return; }
                try {
                    var res = fn.call(el, {navigationUI: 'hide'});
                    if (res && res.then) {
                        res.then(lockLandscape).catch(function () { lockLandscape(); });
                    } else {
                        lockLandscape();
                    }
                } catch (e) { lockLandscape(); }
            }
            function begin() {
                if (started) return;
                started = true;
                gate.classList.add('loading');
                status.innerHTML = '加载中… · Loading…'
                    + '<small>第一次加载需要一点时间</small>';
            }
            var startArea = document.getElementById('as-play');
            if (startArea) {
                startArea.addEventListener('pointerdown', begin);
                startArea.addEventListener('touchstart', begin);
            }
            document.addEventListener('keydown', begin);
            window.as_climb_ready = function () {
                if (!gate) return;
                gate.classList.add('hidden');
                setTimeout(function () { gate.style.display = 'none'; }, 500);
            };
            var fsBtn = document.getElementById('as-fs');
            function updateFsButton() {
                if (!fsBtn) return;
                var active = !!(document.fullscreenElement
                    || document.webkitFullscreenElement);
                fsBtn.style.display = active ? 'none' : '';
            }
            if (fsBtn) {
                fsBtn.addEventListener('click', function (evt) {
                    evt.stopPropagation();
                    goFullscreen();
                    setTimeout(updateFsButton, 600);
                });
                document.addEventListener('fullscreenchange', updateFsButton);
                document.addEventListener('webkitfullscreenchange', updateFsButton);
            }

            // ---------- "add to home screen" recommendation ----------
            var installBox = document.getElementById('as-install');
            var installBtn = document.getElementById('as-install-btn');
            var installTxt = document.getElementById('as-install-txt');
            var installX = document.getElementById('as-install-x');
            var installEvent = null;
            var _ua = navigator.userAgent || '';
            var _ios = /iPad|iPhone|iPod/.test(_ua)
                || (navigator.platform === 'MacIntel'
                    && navigator.maxTouchPoints > 1);
            var _android = /Android/i.test(_ua);
            var _edge = /EdgA?\//i.test(_ua) || /Edg\//i.test(_ua);

            function installedAlready() {
                try {
                    return window.matchMedia('(display-mode: fullscreen)').matches
                        || window.matchMedia('(display-mode: standalone)').matches
                        || window.navigator.standalone === true;
                } catch (e) { return false; }
            }
            function installDismissed() {
                try {
                    return window.localStorage.getItem('as_install_x') === '1';
                } catch (e) { return false; }
            }
            function showInstallCard() {
                if (!installBox || installedAlready() || installDismissed()) return;
                installBox.classList.add('show');
            }
            function hideInstallCard() {
                if (installBox) installBox.classList.remove('show');
            }
            function useInstructions() {
                if (!installTxt) return;
                if (_ios) {
                    installTxt.innerHTML = '添加到主屏幕 · Add to Home Screen'
                        + '<small>点浏览器下方「分享」→「添加到主屏幕」，以后从图标全屏打开</small>';
                } else if (_android) {
                    installTxt.innerHTML = '添加桌面图标 · Add to Home Screen'
                        + '<small>点浏览器右上角「…」菜单 →「添加到主屏幕」或「安装应用」</small>';
                } else {
                    installTxt.innerHTML = '安装到桌面 · Install app'
                        + '<small>使用浏览器地址栏里的安装图标即可</small>';
                }
                if (installBtn) installBtn.style.display = 'none';
                showInstallCard();
            }

            window.addEventListener('beforeinstallprompt', function (evt) {
                if (!isPhone()) { return; }
                evt.preventDefault();
                installEvent = evt;
                if (_edge) {
                    // Edge Android's programmatic prompt opens system settings
                    // instead of installing: show the menu instructions.
                    useInstructions();
                    return;
                }
                if (installTxt) {
                    installTxt.innerHTML = '安装到桌面 · Install app'
                        + '<small>全屏运行、手机横屏、下次一点就开</small>';
                }
                if (installBtn) installBtn.style.display = '';
                showInstallCard();
            });
            if (_ios && !installedAlready() && !installDismissed()) {
                useInstructions();
            }
            if (installBtn) {
                installBtn.addEventListener('click', function (evt) {
                    evt.stopPropagation();
                    if (!installEvent) { useInstructions(); return; }
                    var prompted = installEvent;
                    installEvent = null;
                    try {
                        prompted.prompt();
                        if (prompted.userChoice && prompted.userChoice.then) {
                            prompted.userChoice.then(function (choice) {
                                if (choice && choice.outcome === 'accepted') {
                                    hideInstallCard();
                                }
                            }).catch(function () {
                                useInstructions();
                            });
                        }
                    } catch (e) {
                        useInstructions();
                    }
                });
            }
            if (installX) {
                installX.addEventListener('click', function (evt) {
                    evt.stopPropagation();
                    hideInstallCard();
                    try {
                        window.localStorage.setItem('as_install_x', '1');
                    } catch (e) {}
                });
            }
            window.addEventListener('appinstalled', hideInstallCard);
        })();
    </script>

</body>
</html>
